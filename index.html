<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

#st{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:230px;height:12px;border:1px solid #6a5f45;background:#14110c;pointer-events:none}#st span{position:absolute;left:0;top:-17px;font-size:11px;letter-spacing:.2em;color:#a89b72}

#gun{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:15px;letter-spacing:.2em;color:#d0a878;pointer-events:none;text-shadow:0 0 6px #000}

#card.on{display:flex}
.sh{width:min(560px,92vw);max-height:84vh;box-sizing:border-box;padding:26px 30px 30px;box-shadow:0 14px 44px #000;transform:rotate(-1deg);line-height:1.5;font-size:17px;position:relative;color:#2a2418;background:#d8cba3 linear-gradient(135deg,rgba(0,0,0,.1),transparent 40%,rgba(70,35,0,.22))}

.sh .x{position:absolute;bottom:7px;right:14px;font:11px Georgia,serif;letter-spacing:.2em;color:#6a5d3f}
.jr{font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive;font-size:15px;background-color:#c9bd98}
.lg{font-family:'Courier New',monospace;font-size:13px;background:#d9d2bc repeating-linear-gradient(transparent 0 22px,rgba(40,60,120,.28) 22px 23px);line-height:23px}

.ink b{color:#b01818}
.pc{background:#e9e1c8;font-size:15px}
.case{font-family:'Courier New',monospace;font-size:12.5px;background:#bf9d5e;padding:16px;line-height:1.4;overflow:visible}
.case .tab{position:absolute;top:-24px;left:22px;background:#bf9d5e;padding:3px 16px;font-weight:bold;letter-spacing:.12em;font-size:12px}
.case .pp{background:#e8e4d6;padding:14px 16px 24px;position:relative;box-shadow:inset 0 0 18px rgba(0,0,0,.18)}
.case h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;border-bottom:2px solid #222;padding-bottom:5px}
.case table{border-collapse:collapse;width:100%;margin-bottom:8px}.case td{border:1px solid #555;padding:2px 5px}.case td:nth-child(odd){background:#d3cdb9;font-weight:bold;width:17%}
.case .ph{width:104px;height:78px;float:right;margin:0 0 6px 10px;background:radial-gradient(circle at 42% 48%,#6a6a66 0 12%,#2a2a28 42%,#111);border:5px solid #eee;box-shadow:1px 2px 5px #0008;transform:rotate(3deg)}
.rd{background:#111;color:#111}
.stamp{position:absolute;right:10px;bottom:30px;border:3px solid #a01818;color:#a01818;padding:2px 8px;font-weight:bold;transform:rotate(-11deg);letter-spacing:.1em;opacity:.85}
#sk{background:radial-gradient(ellipse at center,rgba(60,90,20,.15) 20%,rgba(40,70,10,.85) 100%);opacity:0;transition:opacity .5s}
#inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.82);z-index:4;gap:14px;padding:20px}
#inv.on{display:flex}#inv h2{margin:0;font-weight:400;letter-spacing:.35em;color:#c9bfa0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,76px);gap:8px;width:min(700px,92vw);justify-content:center;min-height:80px}
.slot{width:76px;height:76px;border:1px solid #6a5f45;background:#14110c;position:relative;font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot:hover{background:#2a2518;border-color:#c9bf98}.slot b{position:absolute;right:5px;bottom:3px;font:12px Georgia,serif;color:#d8d2c0}
#invs{min-height:20px;color:#c9a37a;letter-spacing:.1em}#invf{font-size:12px;color:#8a8268;letter-spacing:.12em}
#tip{position:fixed;pointer-events:none;background:#0c0a07;border:1px solid #8a7f62;padding:8px 12px;max-width:270px;font-size:13px;line-height:1.45;display:none;z-index:6;color:#d8d2c0}
#tip b{display:block;color:#c9bf98;letter-spacing:.1em;margin-bottom:3px}#tip i{display:block;margin-top:5px;color:#8a8268;font-size:11px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9);text-align:center;padding:24px;gap:14px;z-index:5}
#ov h1{letter-spacing:.35em;font-weight:400;font-size:clamp(28px,6vw,56px);margin:0;color:#c9bfa0}
#ov p{max-width:540px;line-height:1.6;margin:0;color:#aaa28a}
button{font:inherit;background:none;border:1px solid #8a7f62;color:#d8d2c0;padding:10px 28px;letter-spacing:.2em;cursor:pointer}
button:hover{background:#2a2518}
</style></head><body>
<div id="vig" class="fx"></div><div id="red" class="fx"></div><div id="sk" class="fx"></div>
<div id="hud"></div><div id="st"><div id="stb"></div><span>STAMINA</span></div><div id="dot"></div><div id="pr"></div><div id="gun"></div>
<div id="card"></div>
<div id="inv"><h2>INVENTORY</h2><div id="grid"></div><div id="invs"></div><div id="invf">Hover an item to see what it does · Click to use · E / I / Tab to close</div></div><div id="tip"></div>
<div id="ov"><h1 id="oh">WREN HOLLOW</h1><p id="op"></p><button id="ob">BEGIN</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:false});
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),FOG=0x070b10;
scene.background=new THREE.Color(FOG);scene.fog=new THREE.FogExp2(FOG,0.085);
const cam=new THREE.PerspectiveCamera(66,1,.1,120);cam.rotation.order='YXZ';scene.add(cam);
function resize(){const px=innerWidth<700?2:4,w=Math.max(160,Math.floor(innerWidth/px)),h=Math.max(90,Math.floor(innerHeight/px));renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const G=(a,m,x,y,z)=>{const o=new THREE.Mesh(a,m);o.position.set(x||0,y||0,z||0);return o;};
const grp=(p,x,y,z)=>{const g=new THREE.Group();g.position.set(x||0,y||0,z||0);p.add(g);return g;};
const LM=(c)=>new THREE.MeshPhongMaterial({color:c,flatShading:true,specular:0x000000,shininess:0});

// lights
scene.add(new THREE.AmbientLight(0x1b2638,1));
const moon=new THREE.DirectionalLight(0x4a5f8a,.4);moon.position.set(-30,50,20);scene.add(moon);
const torch=new THREE.SpotLight(0xfff0c8,2.6,30,.5,.55,1.4);torch.position.set(.2,-.1,0);cam.add(torch);
const tt=new THREE.Object3D();tt.position.set(0,0,-5);cam.add(tt);torch.target=tt;
const flash=new THREE.PointLight(0xffc070,0,20);cam.add(flash);
const flareL=new THREE.PointLight(0xff2a10,0,26);scene.add(flareL);
const flareM=G(new THREE.SphereGeometry(.12,5,4),new THREE.MeshBasicMaterial({color:0xff5030,fog:false}));flareM.visible=false;scene.add(flareM);

// textures
function mkTex(f){const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');g.fillStyle='#0d0d0f';g.fillRect(0,0,32,32);f(g);const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const planks=(h,s)=>mkTex(g=>{for(let x=0;x<32;x+=8){g.fillStyle='hsl('+h+','+(s+Math.random()*10)+'%,'+(20+Math.random()*9)+'%)';g.fillRect(x,0,7,32);for(let i=0;i<14;i++){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+Math.random()*7,Math.random()*32,1,3+Math.random()*4);}}});
const TX={wood:planks(28,25),barn:planks(8,42),
shingle:mkTex(g=>{for(let y=0;y<32;y+=6)for(let x=-((y/6)%2)*4;x<32;x+=8){g.fillStyle='hsl(20,10%,'+(12+Math.random()*9)+'%)';g.fillRect(x,y,7,5);}}),
stone:mkTex(g=>{for(let y=0;y<32;y+=8)for(let x=-((y/8)%2)*6;x<32;x+=12){g.fillStyle='hsl(210,6%,'+(24+Math.random()*16)+'%)';g.fillRect(x+1,y+1,11,7);}}),
dirt:mkTex(g=>{for(let y=0;y<32;y++)for(let x=0;x<32;x++){const n=Math.random()*26;g.fillStyle='rgb('+(34+n)+','+(42+n*1.2)+','+(26+n*.6)+')';g.fillRect(x,y,1,1);}})};
const gt=TX.dirt.clone();gt.needsUpdate=true;gt.repeat.set(280,280);
const ground=G(new THREE.PlaneGeometry(1400,1400),new THREE.MeshLambertMaterial({map:gt}),0,0,0);ground.rotation.x=-Math.PI/2;scene.add(ground);

// sky
const sky=new THREE.Group();scene.add(sky);
{const sp=[];for(let i=0;i<220;i++){const a=Math.random()*6.28,e=.25+Math.random()*1.2,r=100;sp.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r);}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
sky.add(new THREE.Points(sg,new THREE.PointsMaterial({size:2,sizeAttenuation:false,fog:false,color:0x9aa8c8})));
sky.add(G(new THREE.SphereGeometry(5,8,6),new THREE.MeshBasicMaterial({color:0xcfd8e8,fog:false}),-45,70,-70));}

const gcache=new Map();const BX=(w,h,d)=>{const k=w+','+h+','+d;let g=gcache.get(k);if(!g)gcache.set(k,g=new THREE.BoxGeometry(w,h,d));return g;};
// structures
const cols=new Map(),mc=new Map(),SG=[],ENT=[],keep=[[0,0,9],[57,-70,11],[520,-535,14]];
const PANE=new THREE.MeshBasicMaterial({color:0x05080d}),FRM=LM(0x1c120a);
function addCol(c,x0,x1,z0,z1){for(let i=Math.floor(x0/8);i<=Math.floor(x1/8);i++)for(let j=Math.floor(z0/8);j<=Math.floor(z1/8);j++){const k=i+','+j;let a=cols.get(k);if(!a)cols.set(k,a=[]);a.push(c);}}
TX.brick=mkTex(g=>{for(let y=0;y<32;y+=4)for(let x=-((y/4)%2)*4;x<32;x+=8){g.fillStyle='hsl(10,'+(30+Math.random()*10)+'%,'+(22+Math.random()*10)+'%)';g.fillRect(x+1,y+1,7,3);}});
TX.metal=mkTex(g=>{for(let x=0;x<32;x+=4){g.fillStyle='hsl(205,10%,'+(26+((x/4)%2)*8+Math.random()*3)+'%)';g.fillRect(x,0,4,32);}});
const tc=new Map();
function blockedAt(x,z,r){const ci=Math.floor(x/8),cj=Math.floor(z/8);for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){const a=cols.get(i+','+j);if(!a)continue;for(const c of a){
if(c.r!==undefined){const dx=x-c.x,dz=z-c.z,m=c.r+r;if(dx*dx+dz*dz<m*m)return true;}
else{const cx=Math.max(c.x0,Math.min(x,c.x1)),cz=Math.max(c.z0,Math.min(z,c.z1)),dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<r*r)return true;}}}return false;}
const free=(x,z,r)=>!blockedAt(x,z,r);
function resolve(o,r,y){const ci=Math.floor(o.x/8),cj=Math.floor(o.z/8);for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){const a=cols.get(i+','+j);if(!a)continue;for(const c of a){
if(y>=c.h)continue;
if(c.r!==undefined){const dx=o.x-c.x,dz=o.z-c.z,d=Math.hypot(dx,dz),m=c.r+r;if(d<m&&d>1e-4){o.x=c.x+dx/d*m;o.z=c.z+dz/d*m;}}
else{const cx=Math.max(c.x0,Math.min(o.x,c.x1)),cz=Math.max(c.z0,Math.min(o.z,c.z1)),dx=o.x-cx,dz=o.z-cz,d=Math.hypot(dx,dz);
if(d<r){if(d>1e-4){o.x=cx+dx/d*r;o.z=cz+dz/d*r;}else{const q=[o.x-c.x0,c.x1-o.x,o.z-c.z0,c.z1-o.z],k=q.indexOf(Math.min(...q));if(k===0)o.x=c.x0-r;else if(k===1)o.x=c.x1+r;else if(k===2)o.z=c.z0-r;else o.z=c.z1+r;}}}}}}
const inAny=(x,z)=>{for(const s of ENT)if(Math.abs(x-s.x)<s.w/2+.5&&Math.abs(z-s.z)<s.d/2+.5)return true;return false;};
function M(n,rx,ry,tn){tn=tn||0xffffff;const k=n+rx.toFixed(1)+ry.toFixed(1)+tn;let m=mc.get(k);if(!m){const tk=n+rx.toFixed(1)+ry.toFixed(1);let t=tc.get(tk);if(!t){t=TX[n].clone();t.needsUpdate=true;t.repeat.set(rx,ry);tc.set(tk,t);}m=new THREE.MeshLambertMaterial({map:t,color:tn});mc.set(k,m);}return m;}
let cur,curTint=0xffffff;const newG=()=>{cur=new THREE.Group();scene.add(cur);};
function wall(x,z,w,d,h,n,nc){const m=G(BX(w,h,d),M(n,Math.max(w,d)/2.5,h/2.5,curTint),x,h/2,z);cur.add(m);
if(!nc){const c={x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2};if(h<1.5)c.h=h;addCol(c,c.x0,c.x1,c.z0,c.z1);}return m;}
function house(x,z,w,d,wt,H,gw,ex,o){o=o||{};newG();curTint=o.tint||0xffffff;const tn=curTint,ab=!!o.ab;
const t=.25,fz=z+d/2,a=.45,rs=o.roof||'gable';
cur.add(G(BX(w,.12,d),M('wood',w/2.5,d/2.5,tn),x,.06,z));
wall(x,z-d/2,w,t,H,wt);wall(x-w/2,z,t,d,H,wt);wall(x+w/2,z,t,d,H,wt);
const sg=(w-gw)/2;wall(x-gw/2-sg/2,fz,sg,t,H,wt);wall(x+gw/2+sg/2,fz,sg,t,H,wt);
wall(x,fz,gw,t,H-2.3,wt,1).position.y=2.3+(H-2.3)/2;
if(!ab){const dg=grp(cur,x-gw/2,0,fz);dg.rotation.y=1.2;dg.add(G(BX(gw*.95,2.25,.07),M('wood',gw/2.5,1,tn),gw*.475,1.125,0));}
cur.add(G(BX(gw+.9,.2,1.2),M('stone',1,1,tn),x,.1,fz+.7));
if(d>3.5)for(const s of[-1,1]){cur.add(G(BX(.09,1.2,1.3),FRM,x+s*(w/2+.1),1.8,z));const p=G(new THREE.PlaneGeometry(1,.9),PANE,x+s*(w/2+.16),1.8,z);p.rotation.y=s*Math.PI/2;cur.add(p);}
const hw=w/2+.45,sh=new THREE.Shape();
if(rs==='gable'){sh.moveTo(-hw,0);sh.lineTo(hw,0);sh.lineTo(0,hw*Math.tan(a));}
else if(rs==='lean'){sh.moveTo(-hw,0);sh.lineTo(hw,0);sh.lineTo(hw,.25+w*.2);sh.lineTo(-hw,.25);}
else{sh.moveTo(-hw,0);sh.lineTo(hw,0);sh.lineTo(hw,.35);sh.lineTo(-hw,.35);}
const rf=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:d+.5,bevelEnabled:false}),[M(wt,.4,.4,tn),rs==='flat'&&wt==='stone'?M('stone',.5,.5,tn):M('shingle',.45,.45,tn)]);
rf.position.set(x,H,z-d/2-.25);if(ab){rf.rotation.z=(Math.random()-.5)*.16;rf.position.y-=.2;}cur.add(rf);
if(rs==='gable'&&w>=7){cur.add(G(BX(.7,H+2.8,.7),M('stone',1,3,tn),x+w/2+.35,(H+2.8)/2,z-d/4));addCol({x0:x+w/2,x1:x+w/2+.7,z0:z-d/4-.35,z1:z-d/4+.35},x+w/2,x+w/2+.7,z-d/4-.35,z-d/4+.35);}
if(o.porch&&!ex){for(const s of[-1,1]){cur.add(G(BX(.18,2.4,.18),M('wood',.2,1,tn),x+s*(gw/2+.7),1.2,fz+1.3));addCol({x:x+s*(gw/2+.7),z:fz+1.3,r:.2},x+s*(gw/2+.7),x+s*(gw/2+.7),fz+1.3,fz+1.3);}cur.add(G(BX(gw+1.8,.14,1.6),M('shingle',1,.6,tn),x,2.45,fz+.8));}
if(ex==='church'){wall(x,z-d/2-1.6,3.2,3.2,8,'stone');cur.add(G(new THREE.ConeGeometry(2.6,4.5,4),M('shingle',2,2,tn),x,10.2,z-d/2-1.6));}
if((wt==='wood'||wt==='brick')&&w>=7){wall(x-w/2+1.6,z-d/2+1.4,1.4,.9,.8,'wood');wall(x+w/2-1.2,z-d/2+1.5,1,2,.5,'wood');}
else if(wt!=='wood'&&wt!=='brick'&&w>=5){wall(x-w/2+1,z-d/2+1,.8,.8,.8,'wood');wall(x-w/2+2.1,z-d/2+.8,.7,.7,.6,'wood');}
SG.push({g:cur,x,z,r:Math.max(w,d)+4});keep.push([x,z,Math.max(w,d)/2+7]);
const e={x,z,w,d,ab};ENT.push(e);return e;}
function silo(x,z){newG();curTint=0xffffff;cur.add(G(new THREE.CylinderGeometry(2,2,9,10),M('metal',3,2),x,4.5,z),G(new THREE.ConeGeometry(2.3,2,10),M('shingle',2,1),x,10,z));addCol({x,z,r:2.3},x-2.3,x+2.3,z-2.3,z+2.3);keep.push([x,z,6]);SG.push({g:cur,x,z,r:10});}
function tower(x,z){newG();const h=9;
for(const[a,b]of[[-1,-1],[1,-1],[-1,1],[1,1]]){cur.add(G(BX(.35,h,.35),M('wood',.3,3),x+a*1.5,h/2,z+b*1.5),G(BX(.2,2.2,.2),M('wood',.3,1),x+a*2,h+1.1,z+b*2));}
cur.add(G(BX(4.2,.3,4.2),M('wood',2,2),x,h,z),G(BX(5,.25,5),M('shingle',2,2),x,h+2.3,z),G(BX(.1,h,1),M('wood',.3,3),x,h/2,z+1.6));
addCol({x,z,r:2.1},x-2.1,x+2.1,z-2.1,z+2.1);keep.push([x,z,6]);SG.push({g:cur,x,z,r:10});}
function well(x,z){newG();cur.add(G(new THREE.CylinderGeometry(1,1.05,.9,8,1,true),M('stone',3,1),x,.45,z));
const dk=G(new THREE.CircleGeometry(.95,8),new THREE.MeshBasicMaterial({color:0x020304}),x,.5,z);dk.rotation.x=-Math.PI/2;cur.add(dk);
for(const s of[-1,1])cur.add(G(BX(.12,2.2,.12),M('wood',.2,2),x+s*1,1.6,z));
cur.add(G(BX(2.6,.12,1.3),M('shingle',1,1),x,2.75,z));
addCol({x,z,r:1.2,h:.9},x-1.2,x+1.2,z-1.2,z+1.2);keep.push([x,z,4]);SG.push({g:cur,x,z,r:8});}
function camp(x,z){newG();const rm=LM(0x55585c);for(let i=0;i<8;i++){const a=i*.785;cur.add(G(new THREE.DodecahedronGeometry(.22,0),rm,x+Math.cos(a)*.7,.12,z+Math.sin(a)*.7));}

function insideB(){for(const s of ENT){const dx=P.x-s.x;if(dx>9||dx<-9)continue;if(Math.abs(dx)<s.w/2-.2&&Math.abs(P.z-s.z)<s.d/2-.2)return true;}return false;}
function reset(){Object.assign(P,{x:0,z:0,yaw:0,pitch:0,st:ST,tired:false,y:0,vy:0});found=0;hasGun=false;ammo=0;final=false;t=0;wasSeen=false;hid=false;curP=0;flareT=0;melee='';held='';gunK=0;hits=0;inv.flares=0;inv.tonic=0;sick=0;sickFx=false;
for(const k in bag)bag[k]=0;readN.length=0;renderer.domElement.style.filter='';$('sk').style.opacity=0;eS='dorm';dormT=40;huntT=0;
picks.forEach(p=>{p.done=false;p.m.visible=true;if(p.cm)p.cm.visible=true;});win.visible=false;cabLight.intensity=0;flareL.intensity=0;flareM.visible=false;en.visible=false;en.rotation.set(0,0,0);en.position.y=0;en.stun=0;hideCard();$('inv').classList.remove('on');hud();visSG();}
function begin(){if(state==='title'||state==='dead'||state==='won')reset();initAudio();if(AC&&AC.state==='suspended')AC.resume();
state='play';$('ov').style.display='none';try{renderer.domElement.requestPointerLock();}catch(e){}}
function die(){state='dead';hideCard();document.exitPointerLock&&document.exitPointerLock();screech();burst(900,'lowpass',.8,1);$('red').style.opacity=1;
setTimeout(()=>{$('red').style.opacity=0;ov('HE FOUND YOU','Silas Crane has done this before.','TRY AGAIN',begin);},900);}
function shoot(){if(ammo<=0){msg('Click. Empty.');burst(3000,'highpass',.05,.4);return;}
ammo--;gunK=.15;hud();hideCard();burst(1400,'lowpass',.7,1);thump(1);flash.intensity=4;setTimeout(()=>flash.intensity=0,90);
if(eS!=='hunt'||!en.visible)return;
const tx=en.position.x-cam.position.x,ty=1.9-cam.position.y,tz=en.position.z-cam.position.z,len=Math.hypot(tx,ty,tz);
cam.getWorldDirection(fw);const c=(fw.x*tx+fw.y*ty+fw.z*tz)/len,miss=len*Math.sqrt(Math.max(0,1-c*c));
if(c>0&&miss<1&&len<45){hits++;hud();
if(hits>=3){state='won';en.rotation.x=-Math.PI/2;en.position.y=.4;document.exitPointerLock&&document.exitPointerLock();
setTimeout(()=>ov('IT IS OVER','The third shot drops Silas Crane into the leaves, and the woods go silent. For the first time in three years you can breathe.<br><br>You hold Anna’s ring and walk out of Wren Hollow.','PLAY AGAIN',begin),1600);}
else{eS='flee';fleeT=4;hid=false;burst(250,'lowpass',.3,1);msg('You hit him. He runs.',2.5);}}}
function swing(){if(state!=='play'||!melee||swingCD>0)return;swingCD=.9;swingT=.3;burst(700,'bandpass',.12,.35);
if(eS==='hunt'&&en.visible&&seen&&dist<3.8){const ux=(en.position.x-P.x)/dist,uz=(en.position.z-P.z)/dist;en.position.x+=ux*7;en.position.z+=uz*7;fixEn();en.stun=melee==='crowbar'?5:3;burst(250,'lowpass',.3,1);thump(1);msg('You hit him. He doesn’t scream.');}}
function jump(){if(state!=='play'||P.y>0||P.st<12)return;P.vy=6.6;P.y=.001;P.st-=12;burst(500,'lowpass',.08,.2);}
function tonic(){if((state!=='play'&&state!=='inv')||inv.tonic<1)return;inv.tonic--;P.st=ST;P.tired=false;burst(900,'bandpass',.3,.3);hud();}
function stride(spd,dt){wc+=dt*spd*2.2;const s=Math.sin(wc)*.5;J.thL.rotation.x+=s;J.thR.rotation.x-=s;J.knL.rotation.x+=Math.max(0,-s)*.8;J.knR.rotation.x+=Math.max(0,s)*.8;J.shL.rotation.x-=s*.4;J.shR.rotation.x+=s*.4;hips.position.y+=Math.abs(Math.sin(wc))*.08;
stepE+=spd*dt;if(stepE>1.8){stepE=0;const v=Math.max(0,1-dist/45);if(v>.02){const pan=Math.max(-1,Math.min(1,((en.position.x-P.x)*Math.cos(P.yaw)-(en.position.z-P.z)*Math.sin(P.yaw))/(dist||1)));burst(140+Math.random()*60,'lowpass',.16,.12+v*v*1.1,pan);if(v>.35)thump(v*.5);}}}
function flare(){if(state!=='play'||inv.flares<1)return;inv.flares--;const fx=P.x-Math.sin(P.yaw)*4,fz=P.z-Math.cos(P.yaw)*4;flareL.position.set(fx,.8,fz);flareM.position.set(fx,.12,fz);flareM.visible=true;flareT=16;burst(3000,'highpass',.5,.3);hud();}

// input
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Tab')e.preventDefault();
if(state==='play'){if(e.code==='Digit1'&&hasGun){held='pistol';hud();}if(e.code==='Digit2'&&melee){held=melee;hud();}}
if(e.code==='KeyE'){if(state==='inv')closeInv();else if(state==='play'){if(nearPick()||$('card').classList.contains('on'))interact();else openInv();}}
if(e.code==='KeyI'||e.code==='Tab'){if(state==='inv')closeInv();else openInv();}
if(e.code==='Escape'&&state==='inv')closeInv();if(e.code==='KeyQ')flare();if(e.code==='KeyR')tonic();if(e.code==='KeyF')swing();if(e.code==='Space'){e.preventDefault();jump();}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousedown',e=>{drag=true;if(state!=='play'||!document.pointerLockElement)return;if(e.button===2)swing();else if(e.button===0){if(held==='pistol'&&hasGun)shoot();else if(held&&held!=='pistol')swing();else msg('Nothing equipped. Press 1 or 2, or open your inventory.');}});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(state!=='play'||!(document.pointerLockElement||drag))return;P.yaw-=e.movementX*.0022;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-e.movementY*.0022));});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state==='play'){state='pause';ov('PAUSED','Stay quiet.','RESUME',()=>{state='play';$('ov').style.display='none';try{renderer.domElement.requestPointerLock();}catch(e){}});}});
ov('WREN HOLLOW','Three years ago, they found Anna in these woods. Tonight you find the man who put her there. The old trail leads north-east. It is a long walk.<br><br>WASD move · Space jump · Shift sprint · Mouse look · E interact / open inventory (I or Tab too)<br>1 / 2 equip pistol / melee · Left click use held weapon · Right click / F melee swing · Q flare · R tonic<br>Look down into open boxes in buildings and press E to search them. Abandoned houses hold rotten food: do not eat it. Hit him three times and he is finished. Nothing follows you indoors.','ENTER THE WOODS',begin);
hud();visSG();

// loop
const clock=new THREE.Clock();
function update(dt){
t+=dt;swingCD-=dt;visT-=dt;if(visT<=0){visT=.5;visSG();}
if(sick>0){sick-=dt;coughT-=dt;if(coughT<=0){coughT=5+Math.random()*5;burst(320,'bandpass',.3,.5);}}
const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0);
if(keys.ArrowLeft)P.yaw+=1.8*dt;if(keys.ArrowRight)P.yaw-=1.8*dt;
const moving=f||r,wantSprint=(keys.ShiftLeft||keys.ShiftRight)&&moving&&!P.tired;
if(wantSprint){P.st-=(sick>0?32:20)*dt;if(P.st<=0){P.st=0;P.tired=true;}}else{P.st=Math.min(ST,P.st+(moving?30:60)*(sick>0?.25:1)*dt);if(P.tired&&P.st>ST*.2)P.tired=false;}
const sp=wantSprint?5.6:3.1;
if(moving){const l=Math.hypot(f,r);P.x+=(-Math.sin(P.yaw)*f+Math.cos(P.yaw)*r)/l*sp*dt;P.z+=(-Math.cos(P.yaw)*f-Math.sin(P.yaw)*r)/l*sp*dt;P.bob+=sp*dt*1.6;stepAcc+=sp*dt;
if(P.y<=0&&stepAcc>(wantSprint?2.4:1.9)){stepAcc=0;stepSide^=1;burst(wantSprint?900:600,'lowpass',.13,.3,stepSide?.3:-.3);}}
resolve(P,.4,P.y);
P.x=clampX(P.x);P.z=clampZ(P.z);
let danger=0;seen=false;dist=99;
const inside=insideB();
if(inside){en.visible=false;if(eS==='hunt'||eS==='flee'){eS='dorm';dormT=8;hid=false;}}
else if(eS==='dorm'){en.visible=false;dormT-=dt;if(dormT<=0){eS='hunt';huntT=0;huntMax=45+Math.random()*45;hid=false;spawn(final?26:45);}}
else if(eS==='flee'){fleeT-=dt;const tx=en.position.x-P.x,tz=en.position.z-P.z;dist=Math.hypot(tx,tz)||1;
steer(tx/dist,tz/dist,12.5,dt);en.rotation.y=Math.atan2(tx,tz);
setPose(POSES[3]);stride(12.5,dt);danger=Math.max(0,1-dist/32)*.5;if(fleeT<=0){eS='dorm';dormT=20+Math.random()*20;en.visible=false;}}
else{
huntT+=dt;
const tx=en.position.x-P.x,tz=en.position.z-P.z;dist=Math.hypot(tx,tz)||1;
cam.getWorldDirection(fw);const fl=Math.hypot(fw.x,fw.z)||1;seen=!hid&&dist<14&&(fw.x*tx+fw.z*tz)/(fl*dist)>.72;
if(seen&&!wasSeen){curP=(curP+1+Math.floor(Math.random()*(POSES.length-1)))%POSES.length;}
if(!seen&&wasSeen&&!final&&!hid&&Math.random()<.4){hid=true;hidT=2+Math.random()*3;}
wasSeen=seen;
if(hid){hidT-=dt;en.visible=false;if(hidT<=0){hid=false;const a=P.yaw+Math.PI+(Math.random()-.5)*1.6,d=Math.max(12,dist*.85);en.position.set(clampX(P.x-Math.sin(a)*d),0,clampZ(P.z-Math.cos(a)*d));fixEn();en.visible=true;}}
let spd=(3.6+.3*found)*1.25;if(dist<9)spd*=1.25;
if(seen)spd=final?1.125:0;
if(en.stun>0){en.stun-=dt;spd=0;}
if(hid)spd=0;
let dx=-tx/dist,dz=-tz/dist;
if(flareT>0&&spd>0){const fx=en.position.x-flareL.position.x,fz=en.position.z-flareL.position.z,fd=Math.hypot(fx,fz)||1;if(fd<13){dx=fx/fd;dz=fz/fd;spd=Math.max(spd,4);}}
steer(dx,dz,spd,dt);
en.rotation.y=Math.atan2(-tx,-tz);
setPose(POSES[curP]);
if(spd>.2)stride(spd,dt);
if(seen||en.stun>0){hd.rotation.z+=Math.sin(t*41)*.03;jw.rotation.x+=Math.abs(Math.sin(t*23))*.1;}
tor.scale.y=1+Math.sin(t*2)*.015;
danger=hid?0:Math.max(0,1-dist/32);
if(huntT>huntMax&&!seen&&!final&&dist>14){eS='dorm';dormT=70+Math.random()*80;en.visible=false;hid=false;danger=0;}
else if(dist<1.7&&!hid&&en.visible){die();return;}}
if(flareT>0){flareT-=dt;flareL.intensity=flareT>0?3*(.8+.2*Math.sin(t*40)):0;if(flareT<=0)flareM.visible=false;}
if(swingT>0){swingT-=dt;hatch.rotation.x=-Math.sin(Math.max(0,swingT)/.3*Math.PI)*1.3;}
if(win.visible)win.scale.setScalar(Math.max(1,Math.hypot(P.x-520,P.z+535)/90));
torch.intensity=2.6;if(danger>.4&&Math.random()<danger*.12)torch.intensity=Math.random()*.8;
$('red').style.opacity=Math.min(.7,danger*danger*.8);
const shake=danger>.5?(Math.random()-.5)*.012*danger:0;
if(P.y>0){P.vy-=20*dt;P.y+=P.vy*dt;if(P.y<=0){if(P.vy<-3)burst(300,'lowpass',.12,.35);P.y=0;P.vy=0;}}
cam.position.set(P.x,1.7+P.y+(P.y>0?0:Math.sin(P.bob)*.05),P.z);cam.rotation.y=P.yaw;cam.rotation.x=P.pitch+shake;cam.rotation.z=sick>0?Math.sin(t*1.4)*.06:0;
const sf=sick>0;if(sf!==sickFx){sickFx=sf;renderer.domElement.style.filter=sf?'blur(1.4px) saturate(.7)':'';hud();}$('sk').style.opacity=sf?.5+.2*Math.sin(t*2):0;
gunK=Math.max(0,gunK-dt*1.1);const sw=swingT>0;
hatch.visible=!!melee&&(held===melee||sw);hHandle.visible=hHead.visible=melee==='hammer';cBar.visible=cHook.visible=melee==='crowbar';
gunM.visible=hasGun&&held==='pistol'&&!sw;gunM.position.z=-.5+gunK*.6;gunM.rotation.x=gunK*2.2;gunM.position.y=-.22+Math.sin(P.bob)*.004;
sky.position.copy(cam.position);
if(AC){windG.gain.value=.14+.06*Math.sin(t*.3);droneG.gain.value=danger*.2;
hbT-=dt;if(hbT<=0&&danger>.05){heartbeat(.25+danger*.6);hbT=1.15-.8*danger;}
twT-=dt;if(twT<=0){const pn=Math.random()*2-1;burst(2500,'highpass',.06,.5,pn);setTimeout(()=>burst(1800,'highpass',.05,.35,pn),90);twT=eS==='hunt'?5+Math.random()*7:9+Math.random()*9;}}
if(msgT>0){msgT-=dt;if(msgT<=0)$('pr').textContent='';}
else{const p=nearPick();$('pr').textContent=p?(p.type==='note'?'[E] READ NOTE':p.type==='box'?'[E] SEARCH BOX':'[E] TAKE'):'';}
$('stb').style.width=(P.st/ST*100)+'%';$('stb').style.background=P.tired?'#7a2a2a':'#b8a66a';
}
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());if(state==='play')update(dt);renderer.render(scene,cam);}
loop();
})();

</script></body></html>
